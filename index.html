<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="NEXAI Assistant - Premium AI Chat with Memory System & File Upload. ChatGPT-style conversations with persistent memory and multi-format file support.">
    <meta name="keywords" content="AI Chat, ChatGPT, AI Assistant, Conversation, Memory System, File Upload">
    <meta name="author" content="Lostboy Tech">
    <meta name="theme-color" content="#ff1744">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXAI">
    
    <!-- Open Graph Meta Tags (Social Sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NEXAI Assistant - AI Chat with Memory">
    <meta property="og:description" content="Premium AI Chat powered by advanced language models. Save memories, upload files, and get personalized responses.">
    <meta property="og:image" content="image.png">
    <meta property="og:url" content="">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NEXAI Assistant">
    <meta name="twitter:description" content="AI Chat with Memory System & File Upload">
    <meta name="twitter:image" content="image.png">
    
    <title>NEXAI Assistant - Premium AI Chat with Memory</title>
    
    <!-- Favicon & Web Icon -->
    <link rel="icon" type="image/png" href="image.png" sizes="any">
    <link rel="apple-touch-icon" href="image.png">
    <link rel="shortcut icon" href="image.png">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="logo">
                    <i class="fas fa-brain logo-icon"></i>
                    <span class="logo-text">NEXAI</span>
                </div>
            </div>

            <!-- New Chat Button -->
            <button class="new-chat-btn" id="newChatBtn" title="Start a new conversation">
                <i class="fas fa-plus"></i>
                <span>New Chat</span>
            </button>

            <!-- Search Bar -->
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="chat-search" 
                    placeholder="Search chats..."
                    aria-label="Search conversations"
                >
            </div>

            <!-- Chat List -->
            <div class="chat-list" id="chatList">
                <!-- Chat items will be dynamically inserted here -->
            </div>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <div class="creator-info">
                    <p class="creator-label">Built by</p>
                    <p class="creator-name">Lostboy Tech</p>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="chat-container">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-content">
                    <h1 class="chat-title">
                        <i class="fas fa-robot"></i>
                        NEXAI Assistant
                    </h1>
                    <p class="header-subtitle">Powered by Lostboy Tech</p>
                </div>
                <button class="header-memory-btn" id="headerMemoryBtn" title="View saved memories">
                    <i class="fas fa-brain"></i>
                    <span>Memories</span>
                </button>
            </header>

            <!-- Messages Area -->
            <div class="messages-wrapper" id="messagesWrapper">
                <div class="messages" id="messages">
                    <!-- Messages will be inserted here -->
                </div>
                
                <!-- Loading Indicator -->
                <div class="loading-indicator hidden" id="loadingIndicator">
                    <div class="loader">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span>NEXAI is thinking...</span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <!-- File Upload -->
                    <input
                        type="file"
                        id="fileInput"
                        accept=".txt,.pdf,.json,.md,.csv,.log"
                        class="file-input hidden"
                        aria-label="Upload file"
                    />
                    <button class="input-btn file-btn" id="fileBtn" title="Upload a file">
                        <i class="fas fa-paperclip"></i>
                    </button>

                    <!-- Message Input -->
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Ask me anything... (Ctrl+Enter to send)"
                        class="message-input"
                        autocomplete="off"
                        aria-label="Message input"
                    />

                    <!-- Voice Input -->
                    <button class="input-btn voice-btn" id="voiceBtn" title="Voice input (Web Speech API)">
                        <i class="fas fa-microphone"></i>
                    </button>

                    <!-- Send Button -->
                    <button class="input-btn send-btn" id="sendBtn" title="Send message (Ctrl+Enter)">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <p class="input-hint">Built by Lostboy Tech © 2026 • All Rights Reserved</p>
            </div>
        </main>
    </div>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Chat Actions Modal -->
    <div class="modal hidden" id="chatActionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Chat Options</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Options will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Memory Info Modal -->
    <div class="modal hidden" id="memoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>My Memory</h3>
                <button class="modal-close" id="memoryModalClose">&times;</button>
            </div>
            <div class="modal-body" id="memoryContent">
                <!-- Memory content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
